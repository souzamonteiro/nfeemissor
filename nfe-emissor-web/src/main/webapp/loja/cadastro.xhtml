<ui:composition template="/WEB-INF/loja.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core">
    <ui:define name="titulo">Criar conta | Loja virtual</ui:define>
    <ui:define name="conteudo">
        <h1>Crie sua conta</h1>
        <p>Use os dados que devem constar na sua nota fiscal.</p>
        <h:form styleClass="painel formulario cadastro">
            <div><h:outputLabel for="nome" value="Nome ou razão social"/><h:inputText id="nome" value="#{lojaController.cadastro.xnome}" maxlength="200" required="true"/></div>
            <div><h:outputLabel for="cpf" value="CPF ou CNPJ"/><h:inputText id="cpf" value="#{lojaController.cadastro.cpf}" maxlength="18" required="true"/></div>
            <div><h:outputLabel for="email" value="E-mail"/><h:inputText id="email" value="#{lojaController.cadastro.email}" maxlength="100" required="true"><f:validateRegex pattern="[^\s@]+@[^\s@]+\.[^\s@]+"/></h:inputText></div>
            <div><h:outputLabel for="senha" value="Senha (mínimo de 10 caracteres)"/><h:inputSecret id="senha" value="#{lojaController.senha}" maxlength="128" required="true"><f:validateLength minimum="10" maximum="128"/></h:inputSecret></div>
            <div><h:outputLabel for="cep" value="CEP (somente números)"/><h:inputText id="cep" value="#{lojaController.cadastro.cep}" maxlength="8" required="true"/></div>
            <div><h:outputLabel for="uf" value="Estado (UF)"/><h:selectOneMenu id="uf" value="#{lojaController.cadastro.uf}" required="true">
                <f:selectItem itemValue="" itemLabel="Selecione"/>
                <f:selectItems value="#{['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO']}"/>
            </h:selectOneMenu></div>
            <div><h:outputLabel for="logradouro" value="Logradouro"/><h:inputText id="logradouro" value="#{lojaController.cadastro.xlgr}" maxlength="200" required="true"/></div>
            <div><h:outputLabel for="numero" value="Número"/><h:inputText id="numero" value="#{lojaController.cadastro.nro}" maxlength="10" required="true"/></div>
            <div><h:outputLabel for="bairro" value="Bairro"/><h:inputText id="bairro" value="#{lojaController.cadastro.xbairro}" maxlength="100" required="true"/></div>
            <div><h:outputLabel for="complemento" value="Complemento"/><h:inputText id="complemento" value="#{lojaController.cadastro.xcpl}" maxlength="100"/></div>
            <div><h:outputLabel for="municipio" value="Município"/><h:inputText id="municipio" value="#{lojaController.cadastro.xmun}" maxlength="100" required="true"/></div>
            <div><h:outputLabel for="ibge" value="Código IBGE do município"/><h:inputText id="ibge" value="#{lojaController.cadastro.cmun}" maxlength="7" required="true"/></div>
            <h:commandButton value="Criar conta" action="#{lojaController.criarConta}" styleClass="botao"/>
        </h:form>
    </ui:define>
</ui:composition>
