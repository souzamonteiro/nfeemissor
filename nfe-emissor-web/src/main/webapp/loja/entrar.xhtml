<ui:composition template="/WEB-INF/loja.xhtml" xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets" xmlns:h="http://xmlns.jcp.org/jsf/html">
    <ui:define name="titulo">Entrar | Loja virtual</ui:define>
    <ui:define name="conteudo">
        <h1>Entre na sua conta</h1>
        <h:form styleClass="painel formulario">
            <h:outputLabel for="email" value="E-mail"/>
            <h:inputText id="email" value="#{lojaController.email}" maxlength="100" required="true"/>
            <h:outputLabel for="senha" value="Senha"/>
            <h:inputSecret id="senha" value="#{lojaController.senha}" maxlength="128" required="true"/>
            <h:commandButton value="Entrar" action="#{lojaController.entrar}" styleClass="botao"/>
            <h:link outcome="/loja/cadastro.xhtml" value="Criar conta"/>
        </h:form>
    </ui:define>
</ui:composition>
