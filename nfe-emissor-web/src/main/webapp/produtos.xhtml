<ui:composition template="template.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://java.sun.com/jsf/facelets">
    
    <ui:define name="content">
        <div class="p-p-4">
            <h:form id="form">
                <p:growl id="growl" showDetail="true" life="3000" />
                
                <p:card>
                    <f:facet name="title">
                        <div class="p-d-flex p-ai-center p-jc-between">
                            <div>
                                <i class="pi pi-box p-mr-2"></i>
                                <span class="form-title">Cadastro de Produtos</span>
                            </div>
                            <p:commandButton value="Novo Produto" icon="pi pi-plus" 
                                           action="#{produtoController.novoProduto}" 
                                           update="form"
                                           rendered="#{!produtoController.editando}"/>
                        </div>
                    </f:facet>

                    <!-- Grid de Produtos -->
                    <p:outputPanel id="grid" rendered="#{!produtoController.editando}">
                        <p:dataTable id="produtosTable" var="prod" value="#{produtoController.produtos}" 
                                   paginator="true" rows="10" 
                                   selection="#{produtoController.produtoSelecionado}"
                                   selectionMode="single"
                                   rowKey="#{prod.id}"
                                   emptyMessage="Nenhum produto cadastrado">

                            <p:ajax event="rowSelect" 
                                   listener="#{produtoController.onRowSelect}" 
                                   update="@form"/>
                            <p:ajax event="rowUnselect" 
                                   listener="#{produtoController.onRowUnselect}" 
                                   update="@form"/>
                            
                            <p:column headerText="Código" style="width: 100px;">
                                <h:outputText value="#{prod.cprod}"/>
                            </p:column>

                            <p:column headerText="Descrição">
                                <h:outputText value="#{prod.xprod}"/>
                            </p:column>

                            <p:column headerText="NCM" style="width: 100px;">
                                <h:outputText value="#{prod.ncm}"/>
                            </p:column>

                            <p:column headerText="Valor Unitário" style="width: 120px;">
                                <h:outputText value="#{prod.vuncom}">
                                    <f:convertNumber type="currency" currencyCode="BRL"/>
                                </h:outputText>
                            </p:column>

                            <p:column headerText="Ações" style="width: 120px;">
                                <!-- Botão Editar - passa o produto atual como parâmetro -->
                                <p:commandButton icon="pi pi-pencil" title="Editar" 
                                               action="#{produtoController.editarProduto}"
                                               update="@form"
                                               immediate="true">
                                    <f:setPropertyActionListener target="#{produtoController.produtoSelecionado}" value="#{prod}"/>
                                </p:commandButton>
                                
                                <!-- Botão Excluir - passa o produto atual como parâmetro -->
                                <p:commandButton icon="pi pi-trash" title="Excluir" 
                                               style="margin-left: 5px;"
                                               action="#{produtoController.excluirProduto}"
                                               update="@form"
                                               onclick="if(confirm('Tem certeza que deseja excluir o produto #{prod.xprod}?')) { return true; } else { return false; }">
                                    <f:setPropertyActionListener target="#{produtoController.produtoSelecionado}" value="#{prod}"/>
                                </p:commandButton>
                            </p:column>
                        </p:dataTable>
                    </p:outputPanel>

                    <!-- Formulário de Produto -->
                    <p:outputPanel id="formPanel" rendered="#{produtoController.editando}">
                        <p:panel header="Produto" style="margin-bottom: 20px;">
                            <div class="p-fluid">
                                <div class="p-grid">
                                    <div class="p-col-12 p-md-6">
                                        <p:outputLabel for="cprod" value="Código do Produto"/>
                                        <p:inputText id="cprod" value="#{produtoController.produto.cprod}" 
                                                   required="true" requiredMessage="Código é obrigatório"
                                                   style="width: 100%"/>
                                    </div>

                                    <div class="p-col-12 p-md-6">
                                        <p:outputLabel for="cean" value="Código EAN"/>
                                        <p:inputText id="cean" value="#{produtoController.produto.cean}" 
                                                   style="width: 100%"/>
                                    </div>

                                    <div class="p-col-12">
                                        <p:outputLabel for="xprod" value="Descrição do Produto"/>
                                        <p:inputText id="xprod" value="#{produtoController.produto.xprod}" 
                                                   required="true" requiredMessage="Descrição é obrigatória"
                                                   style="width: 100%"/>
                                    </div>

                                    <div class="p-col-12 p-md-4">
                                        <p:outputLabel for="ncm" value="NCM"/>
                                        <p:inputText id="ncm" value="#{produtoController.produto.ncm}" 
                                                   required="true" requiredMessage="NCM é obrigatório"
                                                   style="width: 100%"/>
                                    </div>

                                    <div class="p-col-12 p-md-4">
                                        <p:outputLabel for="cest" value="CEST"/>
                                        <p:inputText id="cest" value="#{produtoController.produto.cest}" 
                                                   style="width: 100%"/>
                                    </div>

                                    <div class="p-col-12 p-md-4">
                                        <p:outputLabel for="cfop" value="CFOP"/>
                                        <p:inputText id="cfop" value="#{produtoController.produto.cfop}" 
                                                   required="true" requiredMessage="CFOP é obrigatório"
                                                   style="width: 100%"/>
                                    </div>

                                    <div class="p-col-12 p-md-4">
                                        <p:outputLabel for="ucom" value="Unidade"/>
                                        <p:inputText id="ucom" value="#{produtoController.produto.ucom}" 
                                                   required="true" requiredMessage="Unidade é obrigatória"
                                                   style="width: 100%"/>
                                    </div>

                                    <div class="p-col-12 p-md-4">
                                        <p:outputLabel for="vuncom" value="Valor Unitário"/>
                                        <p:inputNumber id="vuncom" value="#{produtoController.produto.vuncom}" 
                                                     required="true" requiredMessage="Valor é obrigatório"
                                                     minValue="0.01" decimalPlaces="4"
                                                     style="width: 100%"/>
                                    </div>
                                </div>

                                <p:panel header="Tributação Principal (ICMS, PIS e COFINS)" toggleable="true" collapsed="true">
                                    <div class="p-grid">
                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="orig" value="Origem da Mercadoria"/>
                                            <p:selectOneMenu id="orig" value="#{produtoController.produto.orig}" 
                                                           style="width: 100%">
                                                <f:selectItem itemLabel="Nacional" itemValue="0"/>
                                                <f:selectItem itemLabel="Estrangeira Importação" itemValue="1"/>
                                                <f:selectItem itemLabel="Estrangeira Adquirida" itemValue="2"/>
                                            </p:selectOneMenu>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="cstIcms" value="Código de Situação Tributária do ICMS (CST)"/>
                                            <p:selectOneMenu id="cstIcms" value="#{produtoController.produto.cstIcms}" 
                                                           style="width: 100%">
                                                <f:selectItem itemLabel="00 - Tributada integralmente" itemValue="00"/>
                                                <f:selectItem itemLabel="20 - Com redução de base" itemValue="20"/>
                                                <f:selectItem itemLabel="40 - Isenta / desonerada" itemValue="40"/>
                                                <f:selectItem itemLabel="41 - Não tributada" itemValue="41"/>
                                                <f:selectItem itemLabel="60 - Substituição Tributária (ICMS-ST)" itemValue="60"/>
                                            </p:selectOneMenu>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="picms" value="Alíquota do ICMS (%)"/>
                                            <p:inputNumber id="picms" value="#{produtoController.produto.picms}" 
                                                         minValue="0" maxValue="100" decimalPlaces="2"
                                                         style="width: 100%"/>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="cstPis" value="Código de Situação Tributária do PIS (CST)"/>
                                            <p:selectOneMenu id="cstPis" value="#{produtoController.produto.cstPis}" 
                                                           style="width: 100%">
                                                <f:selectItem itemLabel="01 - Operação Tributável" itemValue="01"/>
                                                <f:selectItem itemLabel="02 - Operação Tributável" itemValue="02"/>
                                                <f:selectItem itemLabel="03 - Operação Tributável" itemValue="03"/>
                                                <f:selectItem itemLabel="04 - Operação Tributável" itemValue="04"/>
                                                <f:selectItem itemLabel="06 - Operação Tributável" itemValue="06"/>
                                                <f:selectItem itemLabel="07 - Operação Isenta" itemValue="07"/>
                                                <f:selectItem itemLabel="08 - Operação Sem Incidência" itemValue="08"/>
                                                <f:selectItem itemLabel="09 - Operação com Suspensão" itemValue="09"/>
                                            </p:selectOneMenu>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="ppis" value="Alíquota do PIS (%)"/>
                                            <p:inputNumber id="ppis" value="#{produtoController.produto.ppis}" 
                                                         minValue="0" maxValue="100" decimalPlaces="2"
                                                         style="width: 100%"/>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="cstCofins" value="Código de Situação Tributária da COFINS (CST)"/>
                                            <p:selectOneMenu id="cstCofins" value="#{produtoController.produto.cstCofins}" 
                                                           style="width: 100%">
                                                <f:selectItem itemLabel="01 - Operação Tributável" itemValue="01"/>
                                                <f:selectItem itemLabel="02 - Operação Tributável" itemValue="02"/>
                                                <f:selectItem itemLabel="03 - Operação Tributável" itemValue="03"/>
                                                <f:selectItem itemLabel="04 - Operação Tributável" itemValue="04"/>
                                                <f:selectItem itemLabel="06 - Operação Tributável" itemValue="06"/>
                                                <f:selectItem itemLabel="07 - Operação Isenta" itemValue="07"/>
                                                <f:selectItem itemLabel="08 - Operação Sem Incidência" itemValue="08"/>
                                                <f:selectItem itemLabel="09 - Operação com Suspensão" itemValue="09"/>
                                            </p:selectOneMenu>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="pcofins" value="Alíquota da COFINS (%)"/>
                                            <p:inputNumber id="pcofins" value="#{produtoController.produto.pcofins}" 
                                                         minValue="0" maxValue="100" decimalPlaces="2"
                                                         style="width: 100%"/>
                                        </div>
                                    </div>
                                </p:panel>

                                <p:panel header="Tributação ICMS Avançada (Redução, ST e Desoneração)" toggleable="true" collapsed="false" style="margin-top: 12px;">
                                    <div class="p-grid">
                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="modbcIcms" value="Modalidade de Determinação da Base do ICMS"/>
                                            <p:selectOneMenu id="modbcIcms" value="#{produtoController.produto.modbcIcms}" style="width: 100%">
                                                <f:selectItem itemLabel="0 - Margem de Valor Agregado (MVA)" itemValue="0"/>
                                                <f:selectItem itemLabel="1 - Pauta (valor)" itemValue="1"/>
                                                <f:selectItem itemLabel="2 - Preço tabelado máximo" itemValue="2"/>
                                                <f:selectItem itemLabel="3 - Valor da operação" itemValue="3"/>
                                            </p:selectOneMenu>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="pRedBcIcms" value="Percentual de Redução da Base do ICMS (%)"/>
                                            <p:inputNumber id="pRedBcIcms" value="#{produtoController.produto.predbcIcms}"
                                                           minValue="0" maxValue="100" decimalPlaces="2" style="width: 100%"/>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="motDesIcms" value="Motivo da Desoneração do ICMS"/>
                                            <p:selectOneMenu id="motDesIcms" value="#{produtoController.produto.motDesIcms}" style="width: 100%">
                                                <f:selectItem itemLabel="3 - Uso na agropecuária" itemValue="3"/>
                                                <f:selectItem itemLabel="4 - Fomento atividade agropecuária" itemValue="4"/>
                                                <f:selectItem itemLabel="9 - Outros" itemValue="9"/>
                                                <f:selectItem itemLabel="10 - Deficiente físico e condutor" itemValue="10"/>
                                                <f:selectItem itemLabel="11 - Deficiente físico, não condutor" itemValue="11"/>
                                                <f:selectItem itemLabel="16 - Olímpicos e Paralímpicos" itemValue="16"/>
                                                <f:selectItem itemLabel="90 - Solicitado pelo Fisco" itemValue="90"/>
                                            </p:selectOneMenu>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="pst" value="Alíquota do ICMS-ST (%)"/>
                                            <p:inputNumber id="pst" value="#{produtoController.produto.pst}"
                                                           minValue="0" maxValue="100" decimalPlaces="2" style="width: 100%"/>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="vbcstret" value="Base de Cálculo do ICMS ST Retido (R$)"/>
                                            <p:inputNumber id="vbcstret" value="#{produtoController.produto.vbcstret}"
                                                           minValue="0" decimalPlaces="2" style="width: 100%"/>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="vicmssubstituto" value="ICMS do Substituto (R$)"/>
                                            <p:inputNumber id="vicmssubstituto" value="#{produtoController.produto.vicmssubstituto}"
                                                           minValue="0" decimalPlaces="2" style="width: 100%"/>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="vicmsstret" value="ICMS ST Retido (R$)"/>
                                            <p:inputNumber id="vicmsstret" value="#{produtoController.produto.vicmsstret}"
                                                           minValue="0" decimalPlaces="2" style="width: 100%"/>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="vIcmsDeson" value="ICMS Desonerado (R$)"/>
                                            <p:inputNumber id="vIcmsDeson" value="#{produtoController.produto.vicmsdeson}"
                                                           minValue="0" decimalPlaces="2" style="width: 100%"/>
                                        </div>
                                    </div>
                                </p:panel>

                                <p:panel header="RTC (IBS/CBS)" toggleable="true" collapsed="false" style="margin-top: 12px;">
                                    <div class="p-grid">
                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="cstRtc" value="Código de Situação Tributária do RTC (CST)*"/>
                                            <p:inputText id="cstRtc" value="#{produtoController.produto.cstRtc}"
                                                         required="true" requiredMessage="CST RTC é obrigatório"
                                                         maxlength="3" style="width: 100%"/>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="cClassTribRtc" value="Código de Classificação Tributária*"/>
                                            <p:inputText id="cClassTribRtc" value="#{produtoController.produto.cclasstribRtc}"
                                                         required="true" requiredMessage="cClassTrib RTC é obrigatório"
                                                         maxlength="6" style="width: 100%"/>
                                            <small style="color: #666;">Ex.: 000001</small>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="pibsUf" value="Alíquota IBS - Estado (pIBSUF)*"/>
                                            <p:inputNumber id="pibsUf" value="#{produtoController.produto.pibsUf}"
                                                           required="true" requiredMessage="pIBSUF é obrigatório"
                                                           minValue="0" maxValue="100" decimalPlaces="2"
                                                           style="width: 100%"/>
                                            <small style="color: #666;">Ex.: 0,10</small>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="pibsMun" value="Alíquota IBS - Município (pIBSMun)*"/>
                                            <p:inputNumber id="pibsMun" value="#{produtoController.produto.pibsMun}"
                                                           required="true" requiredMessage="pIBSMun é obrigatório"
                                                           minValue="0" maxValue="100" decimalPlaces="2"
                                                           style="width: 100%"/>
                                            <small style="color: #666;">Ex.: 0,00</small>
                                        </div>

                                        <div class="p-col-12 p-md-4">
                                            <p:outputLabel for="pcbsRtc" value="Alíquota da Contribuição sobre Bens e Serviços (pCBS)*"/>
                                            <p:inputNumber id="pcbsRtc" value="#{produtoController.produto.pcbs}"
                                                           required="true" requiredMessage="pCBS é obrigatório"
                                                           minValue="0" maxValue="100" decimalPlaces="2"
                                                           style="width: 100%"/>
                                            <small style="color: #666;">Ex.: 0,90</small>
                                        </div>
                                    </div>
                                </p:panel>

                                <div class="p-d-flex p-jc-end p-mt-3">
                                    <p:commandButton value="Salvar" icon="pi pi-check" 
                                                   action="#{produtoController.salvarProduto}"
                                                   update="@form"
                                                   process="@form"/>
                                    <p:commandButton value="Cancelar" icon="pi pi-times" 
                                                   action="#{produtoController.cancelarEdicao}"
                                                   style="margin-left: 5px;"
                                                   update="@form"/>
                                </div>
                            </div>
                        </p:panel>
                    </p:outputPanel>
                </p:card>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
